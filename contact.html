<!DOCTYPE html>
<html lang="en" class="bg-black">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Cafe by Tamir</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: '#D4AF37',
                        dark: '#0a0a0a',
                        light: '#ffffff'
                    },
                    fontFamily: {
                        serif: ['Cinzel', 'serif'],
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-dark text-light font-sans antialiased selection:bg-gold selection:text-dark overflow-x-hidden">

    <!-- Custom Cursor -->
    <div class="cursor-dot hidden md:block"></div>
    <div class="cursor-outline hidden md:block"></div>

    <!-- Preloader -->
    <div class="preloader fixed inset-0 z-[100] bg-dark flex flex-col justify-center items-center">
        <div class="overflow-hidden mb-4">
            <h1 class="text-4xl md:text-6xl font-serif text-gold tracking-widest uppercase translate-y-full preloader-text">CAFE BY TAMIR</h1>
        </div>
        <div class="w-64 h-[1px] bg-gray-800 relative overflow-hidden">
            <div class="absolute top-0 left-0 h-full bg-gold w-0 preloader-bar"></div>
        </div>
    </div>

    <!-- Navigation -->
    <nav class="fixed w-full z-50 mix-blend-difference py-8 px-8 md:px-16 flex justify-between items-center opacity-0 nav-anim pointer-events-none">
        <a href="index.html" class="text-2xl font-serif font-bold tracking-widest text-light nav-logo pointer-events-auto">CB<span class="text-gold">T</span></a>
        <div class="hidden md:flex space-x-12 text-[0.65rem] uppercase tracking-[0.3em] font-bold">
            <a href="index.html" class="text-light hover:text-gold transition-colors duration-300 pointer-events-auto relative after:content-[''] after:absolute after:-bottom-2 after:left-0 after:w-0 after:h-[1px] after:bg-gold hover:after:w-full after:transition-all after:duration-300">Home</a>
            <a href="menu.html" class="text-light hover:text-gold transition-colors duration-300 pointer-events-auto relative after:content-[''] after:absolute after:-bottom-2 after:left-0 after:w-0 after:h-[1px] after:bg-gold hover:after:w-full after:transition-all after:duration-300">Menu</a>
            <a href="about.html" class="text-light hover:text-gold transition-colors duration-300 pointer-events-auto relative after:content-[''] after:absolute after:-bottom-2 after:left-0 after:w-0 after:h-[1px] after:bg-gold hover:after:w-full after:transition-all after:duration-300">About</a>
            <a href="contact.html" class="text-light hover:text-gold transition-colors duration-300 pointer-events-auto relative after:content-[''] after:absolute after:-bottom-2 after:left-0 after:w-0 after:h-[1px] after:bg-gold hover:after:w-full after:transition-all after:duration-300">Contact</a>
        </div>
        <!-- Mobile Menu Button -->
        <button class="md:hidden text-light focus:outline-none pointer-events-auto">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="square" stroke-width="1.5" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </button>
    </nav>

    <!-- Main Content -->
    <main id="smooth-wrapper">
        <div id="smooth-content">
            <!-- Hero Section -->
            <section class="relative h-screen w-full flex items-center justify-center overflow-hidden">
                <div class="absolute inset-0 bg-black/50 z-10"></div>
                <video autoplay loop muted playsinline class="absolute inset-0 w-full h-full object-cover hero-vid scale-110">
                    <source src="https://upload.wikimedia.org/wikipedia/commons/3/3c/Moccamaster_coffee_maker.webm" type="video/webm">
                </video>

                <div class="relative z-20 text-center px-4 mt-20 w-full">

                <h1 class="text-[8vw] md:text-[6vw] font-serif mb-2 leading-[0.9] tracking-tighter uppercase font-bold text-light title-anim"><span class="block overflow-hidden"><span class="block translate-y-[110%]">Reserve</span></span><span class="block overflow-hidden"><span class="block translate-y-[110%] text-gold">A Table</span></span></h1>

                </div>

                <div class="absolute bottom-10 left-1/2 -translate-x-1/2 z-20 text-light opacity-0 fade-anim flex flex-col items-center">
                    <span class="text-[0.55rem] uppercase tracking-[0.3em] mb-4">Scroll</span>
                    <div class="w-[1px] h-12 bg-gray-600 relative overflow-hidden">
                        <div class="absolute top-0 left-0 w-full h-full bg-gold -translate-y-full animate-[scrolldown_2s_infinite_ease-in-out]"></div>
                    </div>
                </div>
            </section>


        <section class="py-40 bg-dark text-light relative z-20">
            <div class="max-w-[80vw] mx-auto px-6 flex flex-col lg:flex-row gap-24">
                <div class="w-full lg:w-5/12 space-y-16 fade-in-scroll">
                    <div>
                        <h3 class="text-[0.65rem] uppercase tracking-[0.3em] text-gold font-bold mb-6">Location</h3>
                        <p class="font-serif text-2xl leading-relaxed">The Penthouse Suite,<br>123 Luxury Avenue,<br>New York, NY 10001</p>
                    </div>
                    <div>
                        <h3 class="text-[0.65rem] uppercase tracking-[0.3em] text-gold font-bold mb-6">Inquiries</h3>
                        <a href="mailto:concierge@cafebytamir.com" class="font-serif text-2xl leading-relaxed hover:text-gold transition-colors inline-block relative after:content-[''] after:absolute after:w-full after:h-[1px] after:bg-gold after:bottom-0 after:left-0 after:scale-x-0 hover:after:scale-x-100 after:origin-right hover:after:origin-left after:transition-transform after:duration-500">concierge@cafebytamir.com</a>
                        <p class="font-serif text-xl leading-relaxed text-gray-400 mt-2">+1 (555) 123-4567</p>
                    </div>
                </div>

                <div class="w-full lg:w-7/12 fade-in-scroll">
                    <form class="space-y-12">
                        <div class="relative pt-4 group">
                            <input type="text" id="name" class="w-full bg-transparent border-b border-gray-800 py-6 text-xl focus:outline-none focus:border-gold transition-colors peer placeholder-transparent" placeholder="Name">
                            <label for="name" class="absolute left-0 top-10 text-gray-600 font-serif text-xl transition-all duration-500 peer-focus:top-0 peer-focus:text-xs peer-focus:text-gold peer-focus:font-sans peer-focus:uppercase peer-focus:tracking-widest peer-valid:top-0 peer-valid:text-xs peer-valid:font-sans peer-valid:uppercase peer-valid:tracking-widest">Name</label>
                            <div class="absolute bottom-0 left-0 w-0 h-[1px] bg-gold group-focus-within:w-full transition-all duration-700 ease-[cubic-bezier(0.76,0,0.24,1)]"></div>
                        </div>
                        <div class="relative pt-4 group">
                            <input type="email" id="email" class="w-full bg-transparent border-b border-gray-800 py-6 text-xl focus:outline-none focus:border-gold transition-colors peer placeholder-transparent" placeholder="Email">
                            <label for="email" class="absolute left-0 top-10 text-gray-600 font-serif text-xl transition-all duration-500 peer-focus:top-0 peer-focus:text-xs peer-focus:text-gold peer-focus:font-sans peer-focus:uppercase peer-focus:tracking-widest peer-valid:top-0 peer-valid:text-xs peer-valid:font-sans peer-valid:uppercase peer-valid:tracking-widest">Email Address</label>
                            <div class="absolute bottom-0 left-0 w-0 h-[1px] bg-gold group-focus-within:w-full transition-all duration-700 ease-[cubic-bezier(0.76,0,0.24,1)]"></div>
                        </div>
                        <div class="relative pt-4 group">
                            <input type="text" id="date" class="w-full bg-transparent border-b border-gray-800 py-6 text-xl focus:outline-none focus:border-gold transition-colors peer placeholder-transparent" placeholder="Date">
                            <label for="date" class="absolute left-0 top-10 text-gray-600 font-serif text-xl transition-all duration-500 peer-focus:top-0 peer-focus:text-xs peer-focus:text-gold peer-focus:font-sans peer-focus:uppercase peer-focus:tracking-widest peer-valid:top-0 peer-valid:text-xs peer-valid:font-sans peer-valid:uppercase peer-valid:tracking-widest">Requested Date / Party Size</label>
                            <div class="absolute bottom-0 left-0 w-0 h-[1px] bg-gold group-focus-within:w-full transition-all duration-700 ease-[cubic-bezier(0.76,0,0.24,1)]"></div>
                        </div>
                        <div class="pt-8 text-right">
                            <button type="button" class="inline-block border border-gold/30 text-gold px-16 py-6 uppercase tracking-[0.2em] text-xs hover:bg-gold hover:text-dark hover:border-gold transition-all duration-500 relative group overflow-hidden cursor-none">
                                <span class="relative z-10">Submit Inquiry</span>
                                <div class="absolute inset-0 bg-gold translate-y-full group-hover:translate-y-0 transition-transform duration-500 ease-[cubic-bezier(0.76,0,0.24,1)] z-0"></div>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </section>


            <!-- Footer -->
            <footer class="bg-black py-24 px-6 md:px-16 text-light relative z-20 overflow-hidden">
                <div class="max-w-[90vw] mx-auto border-t border-gray-800 pt-16 flex flex-col md:flex-row justify-between items-center gap-10">
                    <div>
                        <h2 class="text-4xl font-serif font-bold tracking-widest text-gold mb-2">CAFE BY TAMIR</h2>
                        <p class="text-gray-500 text-xs tracking-widest uppercase">Est. 2024</p>
                    </div>
                    <div class="flex space-x-10 text-gray-400 text-[0.65rem] tracking-[0.2em] uppercase font-bold">
                        <a href="#" class="hover:text-gold transition-colors relative group"><span class="relative z-10">Instagram</span><span class="absolute left-0 -bottom-1 w-0 h-[1px] bg-gold group-hover:w-full transition-all duration-300"></span></a>
                        <a href="#" class="hover:text-gold transition-colors relative group"><span class="relative z-10">Twitter</span><span class="absolute left-0 -bottom-1 w-0 h-[1px] bg-gold group-hover:w-full transition-all duration-300"></span></a>
                    </div>
                    <p class="text-gray-600 text-[0.65rem] tracking-widest uppercase">&copy; 2024. All rights reserved.</p>
                </div>
            </footer>
        </div>
    </main>

    <!-- Lenis & GSAP -->
    <script src="https://unpkg.com/@studio-freight/lenis@1.0.33/dist/lenis.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
